# Runs the real chains: gates and stages from separate repositories, composed through CNS, on the default branches.
#
# chains/full_chain.py   Governance_Gateway and DGK at ALPHA, DIT and URE at OMEGA, through
#                        cns_composition.super_gate. Eight scenarios, each with the outcome it must produce, one a request the gateway and
#                        DGK's perimeter are shown differently, which `same_subject` refuses.
# chains/spine_run.py    interconnected alpha, zeta, beta and delta run for real, then checked at their seams by
#                        cns_composition.spine_trace, leniently (seven scenarios) and strictly, from each stage's content with a
#                        pipeline context and a delta verification receipt (55: six checks that hold, 44 real attacks each naming the
#                        problem or refusal that should answer it, two of which must come out clean because the record must not change,
#                        and five gaps the check does not close, recorded as facts: 62 in all). Each scenario declares an Expect
#                        (chains/spine_oracle.py): required problems, the only extras allowed, and whether state may change.
# chains/ecology_answer.py  an Ecology answer record judged by DIT's gates through cns_composition.super_gate, the
#                        verdicts bound to the answer text and tied to Ecology's record by its answer hash. Six scenarios, one of
#                        them a DIT gate left out of the request, which cns_composition.super_gate refuses as a breach.
# chains/evidence_spine.py  one document through HERALD, TIE, Conservation_Kernel, Governance_Gateway and CCC, then broken at
#                        each seam. Fifty-eight scenarios: forty-four seams that hold, three gaps stated as facts, four that cross
#                        the process boundary as a signed decision, and seven others (the clean run and the roster refusals).
#
# spine-pinned           the same decision spine, but on the four commits contracts/spine-manifest.json names and nothing else.
#                        The `chains` job above runs each repository's floating default branch, which is the drift detector;
#                        this job runs the set the four repositories declare. It first holds every pin and every checkout to
#                        the manifest (cns_composition.spine_manifest), then runs spine_run.py: all 62 scenarios, including the hardened
#                        components' refusals and the delta receipt. The manifest names the hardened tips (alpha ac34eec, zeta 10b5ba7,
#                        beta c9afa4e, delta 49106db). Individual green CI is not this.
#
# Each script exits 1 when a scenario differs from what it states, so this goes red the day a repository changes in a
# way that breaks a chain: the failure points at the scenario, and the repositories' own suites cannot see it.
#
# TRUST. This runs code from other repositories, so the token is read-only and nothing here can write. The same model
# as the circuit canary in repin.yml. It runs on a schedule, by hand, and on pull requests here that touch the chains
# or the modules they exercise.
name: chains

on:
  schedule:
    - cron: "53 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - chains/**
      - cns/gate.py
      - cns/rowenum.py
      - cns_composition/decision_guard.py
      - cns_composition/gate_chain.py
      - cns_composition/repo_gates.py
      - cns_composition/spine_trace.py
      - cns_composition/spine_manifest.py
      - contracts/spine-manifest.json
      - cns_composition/super_gate.py
      - cns_interop/**
      - interop/act.py
      - .github/workflows/chains.yml

permissions: {}

jobs:
  chains:
    name: chains
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hub
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/Governance_Gateway
          path: stack/Governance_Gateway
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/DGK
          path: stack/DGK
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/DIT
          path: stack/DIT
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/URE
          path: stack/URE
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/interconnected_alpha
          path: stack/interconnected_alpha
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/interconnected_zeta
          path: stack/interconnected_zeta
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/interconnected_beta
          path: stack/interconnected_beta
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/interconnected_delta
          path: stack/interconnected_delta
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/Ecology
          path: stack/Ecology
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/HERALD
          path: stack/HERALD
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/TIE
          path: stack/TIE
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/Conservation_Kernel
          path: stack/Conservation_Kernel
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/ccc
          path: stack/ccc
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install CNS
        run: python -m pip install "./hub[crypto]"
      - name: Four repositories, one chain
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/Governance_Gateway/src:${{ github.workspace }}/stack/DGK:${{ github.workspace }}/stack/DIT/src:${{ github.workspace }}/stack/URE
        run: python hub/chains/full_chain.py
      - name: The decision spine, end to end
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/interconnected_alpha:${{ github.workspace }}/stack/interconnected_zeta:${{ github.workspace }}/stack/interconnected_beta:${{ github.workspace }}/stack/interconnected_delta
        run: python hub/chains/spine_run.py
      - name: An Ecology answer, judged by DIT
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/Ecology:${{ github.workspace }}/stack/DIT/src
        run: python hub/chains/ecology_answer.py
      - name: One document through the evidence spine
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/HERALD:${{ github.workspace }}/stack/TIE/src:${{ github.workspace }}/stack/Conservation_Kernel/src:${{ github.workspace }}/stack/Governance_Gateway/src:${{ github.workspace }}/stack/ccc
        run: python hub/chains/evidence_spine.py

  spine-pinned:
    name: spine-pinned
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hub
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install CNS
        run: python -m pip install "./hub[crypto]"
      - name: The four commits the manifest names
        id: manifest
        working-directory: hub
        run: python -m cns_composition.spine_manifest --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/interconnected_alpha
          ref: ${{ steps.manifest.outputs.alpha }}
          path: stack/interconnected_alpha
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/interconnected_zeta
          ref: ${{ steps.manifest.outputs.zeta }}
          path: stack/interconnected_zeta
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/interconnected_beta
          ref: ${{ steps.manifest.outputs.beta }}
          path: stack/interconnected_beta
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/interconnected_delta
          ref: ${{ steps.manifest.outputs.delta }}
          path: stack/interconnected_delta
          persist-credentials: false
      - name: Every pin and every checkout is the manifest's
        working-directory: hub
        run: python -m cns_composition.spine_manifest --stack ../stack
      - name: The decision spine, end to end, on exactly those commits
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/interconnected_alpha:${{ github.workspace }}/stack/interconnected_zeta:${{ github.workspace }}/stack/interconnected_beta:${{ github.workspace }}/stack/interconnected_delta
        run: python hub/chains/spine_run.py
