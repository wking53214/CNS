# Runs the real chains: gates and stages from separate repositories, composed through CNS, on the default branches.
#
# chains/full_chain.py   Governance_Gateway and DGK at ALPHA, DIT and URE at OMEGA, through
#                        cns_composition.super_gate. Eight scenarios, each with the outcome it must produce, one a request the gateway and
#                        DGK's perimeter are shown differently, which `same_subject` refuses.
# chains/spine_run.py    interconnected alpha, zeta, beta and delta run for real, then checked at their seams by
#                        cns_composition.spine_trace, leniently (seven scenarios) and strictly, from each stage's content with a
#                        pipeline context and a delta verification receipt. 202 scenarios in all, counted from the runner: 50 checks
#                        that hold, 139 attacks each naming the problem or refusal that should answer it (58 problems, 81 refusals),
#                        and 13 gaps the check does not close, recorded as facts. They include the receipt signature (signed:, 14, and keys:, 2,
#                        with delta's signing hook and the reference keys in chains/receipt_keys.py), the durable store across
#                        separate processes (store:, 19, through chains/store_worker.py, with a real SIGKILL) and the verify
#                        command as two processes (package:, 26, chains/make_package.py and chains/verify_package.py) and the domain packs (domain:, 14, a
#                        second domain through all four stages and the pack contract's refusals) and the handoffs under interruption, failure, concurrency
#                        and a stale sibling (handoff:, 4) and signed lock results (signed lock results:, 3) and the same slots filled by SIGNET running as its own process
#                        (signet:, 7, through chains/signet_live.py; SIGNET is checked out at a pinned commit). Each
#                        scenario declares an Expect (chains/spine_oracle.py): required problems, the only extras allowed, and
#                        whether state may change.
# chains/evidence_spine.py  one document through HERALD, TIE, Conservation_Kernel, Governance_Gateway and CCC, then broken at
#                        each seam. Fifty-two scenarios: forty-four seams that hold, three gaps stated as facts, four that cross
#                        the process boundary as a signed decision, and the clean run. Four more checks follow them (three
#                        dropped-gate refusals and the CCC door-naming check), for fifty-six results in all.
# digest-second-language  its own job, so a red chain above cannot hide it. UAI-2's Node digest (written without CNS
#                        code) read through its own strict reader and held to contracts/digest-vectors.json: every
#                        restricted_v1 vector the same, nothing digested differently. Node carries integers only, so no
#                        float digest is compared in a second language; floats are held by the Python consumer
#                        (tests/test_independent_consumer.py). A stub that digests wrongly must fail the same check.
#
# spine-pinned           the same decision spine, but on the four commits contracts/spine-manifest.json names and nothing else.
#                        The `chains` job above runs each repository's floating default branch, which is the drift detector;
#                        this job runs the set the four repositories declare. It first holds every pin and every checkout to
#                        the manifest (cns_composition.spine_manifest), then runs spine_run.py: all 202 scenarios, including the hardened
#                        components' refusals, the delta receipt, its signature and the file store. The manifest names the tips
#                        alpha e771509, zeta 3ab587a, beta af99433 and delta a8f4ffc. Individual green CI is not this. It runs on Python 3.10 (the floor in
#                        pyproject.toml) and 3.12, so the floor is exercised and not only declared.
#
# Each script exits 1 when a scenario differs from what it states, so this goes red the day a repository changes in a
# way that breaks a chain: the failure points at the scenario, and the repositories' own suites cannot see it.
#
# TRUST. This runs code from other repositories, so the token is read-only and nothing here can write. The same model
# as the circuit canary in repin.yml. It runs on a schedule, by hand, and on pull requests here that touch the chains
# or the modules they exercise.
name: chains

on:
  schedule:
    - cron: "53 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - chains/**
      - cns/gate.py
      - cns/rowenum.py
      - cns_composition/decision_guard.py
      - cns_composition/evidence_trace.py
      - cns_composition/figure_check.py
      - cns_composition/gate_chain.py
      - cns_composition/repo_gates.py
      - cns_composition/spine_trace.py
      - cns_composition/delivery.py
      - cns_composition/spine_manifest.py
      - cns_composition/evidence_bundle.py
      - contracts/spine-manifest.json
      - contracts/digest-vectors.json
      - cns_composition/super_gate.py
      - .github/workflows/chains.yml

permissions: {}

jobs:
  chains:
    name: chains
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: hub
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/Governance_Gateway
          path: stack/Governance_Gateway
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/DGK
          path: stack/DGK
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/DIT
          path: stack/DIT
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/URE
          path: stack/URE
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/interconnected_alpha
          path: stack/interconnected_alpha
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/interconnected_zeta
          path: stack/interconnected_zeta
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/interconnected_beta
          path: stack/interconnected_beta
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/interconnected_delta
          path: stack/interconnected_delta
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/SIGNET
          path: stack/SIGNET
          # Pinned to an exact commit, the keyholder the `signet:` scenarios start as its own process. Moving it is
          # an explicit act: update this ref in both jobs together, after re-running the chains on the new commit.
          ref: e0d7c608e8f1b6cabe888e300bad34492caa99b9
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/HERALD
          path: stack/HERALD
          # Pinned to an exact commit, not the moving main branch. Moving it
          # is an explicit act: update this ref and HERALD_VERSION and
          # HERALD_CODE_HASH below together (see the pin step).
          ref: d7054aa7d53f91ff5912ab8d37b3df5503a71dff
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/TIE
          path: stack/TIE
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/Conservation_Kernel
          path: stack/Conservation_Kernel
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/ccc
          path: stack/ccc
          persist-credentials: false
      # UAI-1 (cns_interop and interop/act.py) lives in the UAI repository since it moved out of this one. The
      # evidence spine signs its roster decision with it, so it is checked out like the other repositories.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/UAI-2
          path: stack/UAI-2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install CNS
        run: python -m pip install "./hub[crypto]"
      - name: Enforce the HERALD pin
        # HERALD's constitution (section 7) asks every consumer to pin its
        # version and code hash. This is that check: if the checked-out
        # build is not the one recorded here, the run fails before any
        # chain runs. To upgrade, re-run the chains on the new build, then
        # update the ref above and the two values below in one commit.
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/HERALD
          HERALD_VERSION: "0.6.0"
          HERALD_CODE_HASH: 3d231b0f2f63e16baa2324072c28ce6dd590403a8cd5b103cdfc0e2b158f0447
        run: |
          python - <<'PY'
          import os
          from herald.binding import Binding
          Binding("cns-chains", os.environ["HERALD_VERSION"], os.environ["HERALD_CODE_HASH"]).verify()
          print("HERALD pin ok")
          PY
      - name: Negative controls, the pin refuses what it must refuse
        # Proves the check above can fail. Each case below must be refused
        # with BindingError; if any is accepted, this step fails the run.
        # The one case that must pass (the real pin) is the step above.
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/HERALD
          HERALD_VERSION: "0.6.0"
          HERALD_CODE_HASH: 3d231b0f2f63e16baa2324072c28ce6dd590403a8cd5b103cdfc0e2b158f0447
        run: |
          python - <<'PY'
          import os, sys
          from herald.binding import Binding
          from herald.errors import BindingError
          version = os.environ["HERALD_VERSION"]
          good_hash = os.environ["HERALD_CODE_HASH"]
          cases = {
              "right version, wrong hash": (version, "0" * 64),
              "right version, missing hash": (version, None),
              "old version 0.5.0 with its old hash": (
                  "0.5.0", "b0e8dd49119ed05eb4a072ce41161879cb92629c79f0d0626839785e8d22da69"),
              "old version 0.4.0 with its old hash": (
                  "0.4.0", "4cce2e1fd02feae34df54ce22092cd8168f70c7ace06b07469da33231f78262a"),
              "old version 0.3.1 with its old hash": (
                  "0.3.1", "9501ca9fb17e26f9cd0f5061c3c16389390ac52c2ea7bf149f1f2e04b17acd23"),
              "old version with the current hash": ("0.4.0", good_hash),
          }
          failed = []
          for name, (v, h) in cases.items():
              try:
                  Binding("cns-chains", v, h).verify()
              except BindingError:
                  print("refused, as required:", name)
              else:
                  failed.append(name)
          if failed:
              sys.exit("pin accepted: " + "; ".join(failed))
          print("all negative controls refused")
          PY
      - name: Four repositories, one chain
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/Governance_Gateway/src:${{ github.workspace }}/stack/DGK:${{ github.workspace }}/stack/DIT/src:${{ github.workspace }}/stack/URE
        run: python hub/chains/full_chain.py
      - name: The decision spine, end to end
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/interconnected_alpha:${{ github.workspace }}/stack/interconnected_zeta:${{ github.workspace }}/stack/interconnected_beta:${{ github.workspace }}/stack/interconnected_delta:${{ github.workspace }}/stack/SIGNET
        run: python hub/chains/spine_run.py
      - name: One document through the evidence spine
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/HERALD:${{ github.workspace }}/stack/TIE/src:${{ github.workspace }}/stack/Conservation_Kernel/src:${{ github.workspace }}/stack/Governance_Gateway/src:${{ github.workspace }}/stack/ccc:${{ github.workspace }}/stack/UAI-2
        run: python hub/chains/evidence_spine.py
      - name: A model's answer to CCC's store over UAI-1
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/HERALD:${{ github.workspace }}/stack/TIE/src:${{ github.workspace }}/stack/Conservation_Kernel/src:${{ github.workspace }}/stack/Governance_Gateway/src:${{ github.workspace }}/stack/ccc:${{ github.workspace }}/stack/UAI-2
        run: python hub/chains/uai_to_ccc.py

  digest-second-language:
    name: digest-second-language
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: hub
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/UAI-2
          path: stack/UAI-2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Node is present
        run: node --version
      - name: The checker fails a digest that disagrees
        run: |
          if python hub/chains/node_digest_agreement.py hub/conformance/node_stub/wrong_digest.mjs hub/contracts/digest-vectors.json; then
            echo "the checker passed a stub that digests wrongly"; exit 1
          fi
      - name: UAI-2's Node digest agrees with the vectors
        run: python hub/chains/node_digest_agreement.py stack/UAI-2/interop/node/uai.mjs hub/contracts/digest-vectors.json

  spine-pinned:
    name: spine-pinned
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: hub
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CNS
        run: python -m pip install "./hub[crypto]"
      - name: The four commits the manifest names
        id: manifest
        working-directory: hub
        run: python -m cns_composition.spine_manifest --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/interconnected_alpha
          ref: ${{ steps.manifest.outputs.alpha }}
          path: stack/interconnected_alpha
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/interconnected_zeta
          ref: ${{ steps.manifest.outputs.zeta }}
          path: stack/interconnected_zeta
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/interconnected_beta
          ref: ${{ steps.manifest.outputs.beta }}
          path: stack/interconnected_beta
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/interconnected_delta
          ref: ${{ steps.manifest.outputs.delta }}
          path: stack/interconnected_delta
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/SIGNET
          path: stack/SIGNET
          # Pinned to an exact commit, the keyholder the `signet:` scenarios start as its own process. Moving it is
          # an explicit act: update this ref in both jobs together, after re-running the chains on the new commit.
          ref: e0d7c608e8f1b6cabe888e300bad34492caa99b9
          persist-credentials: false
      - name: Every pin and every checkout is the manifest's
        working-directory: hub
        run: python -m cns_composition.spine_manifest --stack ../stack
      - name: The decision spine, end to end, on exactly those commits
        env:
          PYTHONPATH: ${{ github.workspace }}/stack/interconnected_alpha:${{ github.workspace }}/stack/interconnected_zeta:${{ github.workspace }}/stack/interconnected_beta:${{ github.workspace }}/stack/interconnected_delta:${{ github.workspace }}/stack/SIGNET
        run: python hub/chains/spine_run.py
