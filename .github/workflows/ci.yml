# The check that runs before a consumer can pin a commit.
#
# Three repositories pin this package by commit SHA. Until this workflow
# existed, nothing ran the test suite before one of those pins moved, and a
# broken contract was discoverable only by a consumer's own tests failing
# some days later. The README is right that consumer tests are the check that
# can fail; this is the check that runs first.
#
# The Python matrix is not decorative. This package's enums use the
# `(str, Enum)` mixin, whose string and formatting behaviour has shifted
# across recent releases, and `pyproject.toml` promises support from 3.10.
# A contract package that serializes differently depending on the
# interpreter is not a contract.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    name: test (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Tests, including the public-shape snapshot
        run: python -m pytest -q
      - name: Type check the package it claims to type
        # cns/py.typed tells every consumer's checker to trust these
        # annotations. Shipping that marker over annotations that do not
        # check is worse than shipping no marker at all.
        run: python -m mypy --strict cns/
      - name: Lint (ruff, rules named in pyproject.toml, version pinned in the dev extra)
        run: python -m ruff check .
      - name: Type check the composition package (mypy, not strict, clean)
        # cns_composition is the code that does things: it reads files, runs git and writes the manifest. It is not
        # annotated to --strict, but it checks clean, and this keeps it so.
        run: python -m mypy cns_composition
      - name: Type check the interface package (UAI-1)
        run: python -m mypy cns_interop
      - name: Node for the second UAI-1 implementation (the suite runs it and fails without it)
        run: node --version

  packaging:
    runs-on: ubuntu-latest
    name: packaging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip build
      - run: python -m build --wheel --outdir dist/
      - name: The typing marker must actually ship
        # A py.typed present in the tree but absent from the wheel is
        # invisible: consumers install the wheel, and their checkers go back
        # to ignoring every annotation. This has to be asserted, not assumed.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/cns-*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          print(f"{wheel}:")
          for n in sorted(names):
              print("  ", n)
          if "cns/py.typed" not in names:
              sys.exit("FAIL: cns/py.typed is missing from the wheel")
          print("OK: cns/py.typed ships")
          # Link imports cns_composition from an installed cns. Without it in
          # the wheel that import fails on any pinned install, and nothing in
          # this repository's own tests can see it because they run in place.
          # The maintenance tools ship too (the installed v1.9.0 tag lacked cns_versions, which the tree had),
          # and the contract files do not: a pin is state, and the tools say so when run from a wheel.
          for needed in ("cns_composition/__init__.py", "cns_composition/gate_chain.py",
                         "cns_composition/ccc_admission.py", "cns_composition/triad_admission.py",
                         "cns_composition/resubmission.py", "cns_composition/cns_versions.py",
                         "cns_composition/install_stack.py", "cns_composition/circuit_refusals.py",
                         "cns_composition/delivery.py"):
              if needed not in names:
                  sys.exit(f"FAIL: {needed} is missing from the wheel")
          leaked = [n for n in names if "/tests/" in n or n.startswith("tests/")]
          if leaked:
              sys.exit(f"FAIL: tests ship in the wheel: {leaked}")
          if any(n.startswith("contracts/") or "/contracts/" in n for n in names):
              sys.exit("FAIL: contracts/ ships in the wheel; a pin is state and the package holds none")
          print("OK: cns_composition ships with its tools, its tests and the contract files do not")
          PY
