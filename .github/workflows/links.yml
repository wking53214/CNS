# Holds contracts/cns-links.json true: the claim of which repositories are connected to CNS, in which direction.
#
# The ledger names, for every repository, the file that proves each direction. This checks out every repository
# in it (the list comes from the ledger, so a new row needs no edit here) and runs cns_composition.link_ledger,
# which opens those files and fails on a claim they do not support. It reads files as text and runs nothing from
# the other repositories, and the token can only read.
#
# A repository the token cannot read (a private one) is left out of the folder with a warning. That is fine
# while its ledger row claims no repo-side proof, and a failure the day it does: the checker, not this file,
# decides.
#
# The second step is the other direction: cns_composition.consumers lists what each repository takes from CNS,
# fails if CNS stopped providing any of it, and fails if a repository's source has moved away from the list.
#
# The fourth step is the version: cns_composition.cns_versions reads every repository's CNS pin and fails on one the
# release table does not know or one below its floor. A connection that exists against an old CNS is not the same as
# a connection to this one; the ledger alone cannot tell them apart.
#
# It runs on a schedule because a connection can be removed in another repository without touching this one, and
# on any pull request here, or push to main, that changes the ledger, the checker, cns/gate.py or a digest contract.
#
# The second job, kernel-digest, is the one place CNS runs another repository's code: it puts CNS's digest contract
# files over STACK-Kernel's vendored copies and runs STACK-Kernel's Rust digest tests, so a change to cns/gate.py or
# to the vectors that the Rust reproductions do not follow fails here, before merge. It is its own job with a
# read-only token and no secrets, and the links job above uses nothing it produces. The dependency is one way:
# STACK-Kernel builds and tests without CNS, against its own vendored copies.
name: links

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - contracts/cns-links.json
      - cns_composition/link_ledger.py
      - cns_composition/consumers.py
      - cns_composition/digest_vectors.py
      - contracts/digest-vectors.json
      - cns_composition/cns_versions.py
      - contracts/cns-releases.json
      - .github/workflows/links.yml
      - cns/gate.py
      - cns_composition/digest_differential.py
      - contracts/digest-differential.json
  push:
    branches:
      - main
    paths:
      - contracts/cns-links.json
      - cns_composition/link_ledger.py
      - cns_composition/consumers.py
      - cns_composition/digest_vectors.py
      - contracts/digest-vectors.json
      - cns_composition/cns_versions.py
      - contracts/cns-releases.json
      - .github/workflows/links.yml
      - cns/gate.py
      - cns_composition/digest_differential.py
      - contracts/digest-differential.json

permissions: {}

jobs:
  links:
    name: links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hub
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Check out every repository the ledger lists
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir stack
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          python3 - <<'PY' > names.txt
          import json
          for name, row in json.load(open("hub/contracts/cns-links.json"))["repos"].items():
              if not row.get("hub"):
                  print(name)
          PY
          while read -r name; do
            if ! git -c "http.extraheader=AUTHORIZATION: basic $basic" clone --quiet --depth 1 \
                 "https://github.com/$OWNER/$name.git" "stack/$name" 2>/dev/null; then
              echo "::warning::could not check out $name; only claims that need it will fail"
              rm -rf "stack/$name"
            fi
          done < names.txt
          ls stack | wc -l
      - name: Every claim in the ledger holds
        working-directory: hub
        env:
          PYTHONPATH: ${{ github.workspace }}/hub
        run: python -m cns_composition.link_ledger --stack ../stack
      - name: CNS still provides what the repositories take from it, and the list still matches their source
        working-directory: hub
        env:
          PYTHONPATH: ${{ github.workspace }}/hub
        run: python -m cns_composition.consumers --stack ../stack
      - name: Repositories that vendor CNS's digest vectors have not fallen behind
        working-directory: hub
        env:
          PYTHONPATH: ${{ github.workspace }}/hub
        run: python -m cns_composition.digest_vectors --stack ../stack
      - name: Every repository pins a CNS release the table knows, at or above the floor
        working-directory: hub
        env:
          PYTHONPATH: ${{ github.workspace }}/hub
        run: python -m cns_composition.cns_versions --stack ../stack

  kernel-digest:
    name: kernel-digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hub
          persist-credentials: false
      - name: Check out STACK-Kernel
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          if ! git -c "http.extraheader=AUTHORIZATION: basic $basic" clone --quiet --depth 1 \
               "https://github.com/$OWNER/STACK-Kernel.git" kernel 2>/dev/null; then
            echo "::error::could not check out STACK-Kernel, so its Rust digest tests did not run"
            exit 1
          fi
      - name: Put CNS's digest contract files over STACK-Kernel's vendored copies
        run: |
          cp hub/contracts/digest-vectors.json kernel/crates/stack-sentinel/tests/fixtures/cns-digest-vectors.json
          cp hub/contracts/digest-differential.json kernel/crates/stack-sentinel/tests/fixtures/digest-differential.json
          git -C kernel status --short
      - name: STACK-Kernel's Rust reproductions of subject_digest agree with this commit of CNS
        working-directory: kernel
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable test -p stack-sentinel --test cns_vectors --locked
          cargo +stable test -p stack-trident --test cns_digest --locked
