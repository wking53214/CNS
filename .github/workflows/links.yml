# Holds contracts/cns-links.json true: the claim of which repositories are connected to CNS, in which direction.
#
# The ledger names, for every repository, the file that proves each direction. This checks out every repository
# in it (the list comes from the ledger, so a new row needs no edit here) and runs cns_composition.link_ledger,
# which opens those files and fails on a claim they do not support. It reads files as text and runs nothing from
# the other repositories, and the token can only read.
#
# A repository the token cannot read (a private one) is left out of the folder with a warning. That is fine
# while its ledger row claims no repo-side proof, and a failure the day it does: the checker, not this file,
# decides.
#
# The second step is the other direction: cns_composition.consumers lists what each repository takes from CNS,
# fails if CNS stopped providing any of it, and fails if a repository's source has moved away from the list.
#
# It runs on a schedule because a connection can be removed in another repository without touching this one, and
# on any pull request here that changes the ledger or the checker.
name: links

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - contracts/cns-links.json
      - cns_composition/link_ledger.py
      - cns_composition/consumers.py
      - cns_composition/digest_vectors.py
      - contracts/digest-vectors.json
      - .github/workflows/links.yml

permissions: {}

jobs:
  links:
    name: links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: hub
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out every repository the ledger lists
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir stack
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          python3 - <<'PY' > names.txt
          import json
          for name, row in json.load(open("hub/contracts/cns-links.json"))["repos"].items():
              if not row.get("hub"):
                  print(name)
          PY
          while read -r name; do
            if ! git -c "http.extraheader=AUTHORIZATION: basic $basic" clone --quiet --depth 1 \
                 "https://github.com/$OWNER/$name.git" "stack/$name" 2>/dev/null; then
              echo "::warning::could not check out $name; only claims that need it will fail"
              rm -rf "stack/$name"
            fi
          done < names.txt
          ls stack | wc -l
      - name: Every claim in the ledger holds
        working-directory: hub
        env:
          PYTHONPATH: ${{ github.workspace }}/hub
        run: python -m cns_composition.link_ledger --stack ../stack
      - name: CNS still provides what the repositories take from it, and the list still matches their source
        working-directory: hub
        env:
          PYTHONPATH: ${{ github.workspace }}/hub
        run: python -m cns_composition.consumers --stack ../stack
      - name: Repositories that vendor CNS's digest vectors have not fallen behind
        working-directory: hub
        env:
          PYTHONPATH: ${{ github.workspace }}/hub
        run: python -m cns_composition.digest_vectors --stack ../stack
