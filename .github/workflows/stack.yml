# Does the circuit install and run together, right now, as a consumer would get it?
#
# Every other check here looks at one repository, or at text. This one installs the whole stack the way the README
# tells a person to (`pip install -r contracts/install-stack.txt`), checks that pip is satisfied with the result and
# that exactly one `cns` is in it, checks out the seven repositories at the commits contracts/warden-stack.json
# names, and then runs the four checks that need all of them at once:
#
#   seat_pins       the repositories pin each shared package identically, and all seven were read
#   cns_versions    every CNS pin is a release the table knows, at or above its floor, and all seven were read
#   repin --check   the manifest equals the HEAD of each checkout (the checkouts ARE the manifest, so this holds the
#                   manifest to itself and fails if a commit could not be checked out as named)
#   circuit_canary  the whole circuit runs on a throwaway repository and ends ACCEPT
#
# It runs on pushes and pull requests to main and to the horsemen branch, and weekly, because the stack can break
# without a change here: a tag that moves, a dependency that releases, a pin another repository changes.
#
# TRUST. The token can only read. The seven repositories are cloned without a credential, and the canary runs their
# code, so nothing here can write anywhere. No expression from the event is spliced into a shell: values reach a
# script through env.
#
# ADDING A REPOSITORY. List it in contracts/warden-stack.json and in contracts/install-stack.txt. The checkout step
# reads the manifest, so it needs no edit; tests/test_stack_workflow.py fails if the two files disagree.
name: stack

on:
  push:
    branches:
      - main
      - claude/horsemen-production-status-5wsndb
  pull_request:
    branches:
      - main
      - claude/horsemen-production-status-5wsndb
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    name: stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hub
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the whole circuit the way the README says
        working-directory: hub
        # pytest runs the throwaway repository's suite. numpy and matplotlib: ASSAY treats a claim it cannot run as a
        # failure, and one claim needs them. The numpy pin is the one install-stack.txt gives for Python 3.12.
        run: python -m pip install -r contracts/install-stack.txt "pytest>=8" numpy==2.5.4 matplotlib==3.11.2
      - name: pip is satisfied with what it installed
        run: python -m pip check
      - name: Exactly one cns distribution is installed
        run: |
          python - <<'PY'
          import re
          from importlib.metadata import distributions
          found = sorted({(d.metadata["Name"], d.version, str(d.locate_file(""))) for d in distributions()
                          if re.sub(r"[-_.]+", "-", d.metadata["Name"] or "").lower() == "cns"})
          for name, version, path in found:
              print(f"{name} {version} at {path}")
          assert len(found) == 1, f"expected exactly one cns distribution, found {len(found)}"
          PY
      - name: Check out the seven repositories at the commits the manifest names
        env:
          BASE_URL: https://github.com/${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          base = os.environ["BASE_URL"].rstrip("/")
          repos = json.load(open("hub/contracts/warden-stack.json", encoding="utf-8"))["repos"]
          if not repos:
              sys.exit("the manifest names no repository")
          os.makedirs("stack", exist_ok=True)
          for name, sha in repos.items():
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  sys.exit(f"{name}: {sha!r} is not a full commit")
              if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]*", name):
                  sys.exit(f"{name!r} is not a repository name")
              dest = f"stack/{name}"
              subprocess.run(["git", "clone", "--quiet", "--no-checkout", f"{base}/{name}.git", dest], check=True)
              subprocess.run(["git", "-C", dest, "checkout", "--quiet", "--detach", sha], check=True)
              head = subprocess.run(["git", "-C", dest, "rev-parse", "HEAD"], check=True,
                                    capture_output=True, text=True).stdout.strip()
              if head != sha:
                  sys.exit(f"{name} is at {head}, not {sha}")
              print(f"{name} {head}")
          PY
      - name: Every repository pins a shared package the same way, and all seven were read
        working-directory: hub
        env:
          PYTHONPATH: ${{ github.workspace }}/hub
        run: python -m cns_composition.seat_pins --stack ../stack
      - name: Every repository pins a CNS release the table knows, and all seven were read
        working-directory: hub
        env:
          PYTHONPATH: ${{ github.workspace }}/hub
        run: python -m cns_composition.cns_versions --stack ../stack
      - name: The manifest is the HEAD of each checkout
        working-directory: hub
        env:
          PYTHONPATH: ${{ github.workspace }}/hub
        run: python -m cns_composition.repin --stack ../stack --check
      - name: The whole circuit runs on that combination and ends ACCEPT
        working-directory: hub
        env:
          PYTHONPATH: ${{ github.workspace }}/hub
        run: python -m cns_composition.circuit_canary --stack ../stack --cns .
