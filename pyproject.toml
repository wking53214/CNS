[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cns"
version = "1.8.0"
description = "Central nervous system: the contracts every repo in the library joins on."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[tool.setuptools.packages.find]
# The wheel carries two packages. `cns` is the shapes package and stays
# shapes-only. `cns_composition` is a sibling (behaviour over cns.gate) that
# used to be left out on purpose; Link imports it, and with it missing a
# pinned install of this repository could not run Link at all. It ships beside
# `cns`, never inside it, and its tests do not ship.
include = ["cns", "cns.*", "cns_composition", "cns_composition.*"]
exclude = ["cns_composition.tests", "cns_composition.tests.*"]

# PEP 561. Without this marker a consumer's mypy or pyright treats the whole
# package as untyped and silently ignores every annotation in it, which for a
# package whose deliverable is typed row shapes is most of the value.
[tool.setuptools.package-data]
cns = ["py.typed"]

[tool.pytest.ini_options]
# Every test directory. The composition tests once lived under a directory
# the runner never looked at, which is where five skips hid from the
# no-skip conftest for a while.
testpaths = ["tests", "cns_composition/tests"]
