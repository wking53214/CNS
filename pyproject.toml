[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cns"
version = "1.3.0"
description = "Central nervous system: the contracts every repo in the library joins on."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[tool.setuptools.packages.find]
# The wheel is the shapes package only. cns_composition is a sibling
# package in this repository (behaviour over cns.gate) and is deliberately
# not shipped with it.
include = ["cns", "cns.*"]

# PEP 561. Without this marker a consumer's mypy or pyright treats the whole
# package as untyped and silently ignores every annotation in it, which for a
# package whose deliverable is typed row shapes is most of the value.
[tool.setuptools.package-data]
cns = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
